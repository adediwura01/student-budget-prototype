<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finset.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6037a2" />
    <meta name="description" content="FinSet: a considered workspace for student finances. Frontend prototype." />
    <title>FinSet | Your financial workspace</title>
    <script>
      try {
        const saved = localStorage.getItem('finset.appearance');
        const appearance = ['light', 'dark', 'system'].includes(saved) ? saved : 'light';
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = appearance === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : appearance;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
